<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="cbBridgeGrad" x1="12" y1="64" x2="116" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- arch -->
  <path d="M20 86 A 44 44 0 0 1 108 86" stroke="url(#cbBridgeGrad)" stroke-width="9" stroke-linecap="round"/>
  <!-- suspension cables -->
  <g stroke="url(#cbBridgeGrad)" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="40" y1="50" x2="40" y2="90"/>
    <line x1="64" y1="43" x2="64" y2="90"/>
    <line x1="88" y1="50" x2="88" y2="90"/>
  </g>
  <!-- deck -->
  <rect x="16" y="88" width="96" height="9" rx="4.5" fill="url(#cbBridgeGrad)"/>
  <!-- endpoint nodes (the things the bridge connects) -->
  <circle cx="16" cy="64" r="7" fill="#8B5CF6"/>
  <circle cx="112" cy="64" r="7" fill="#06B6D4"/>
</svg>
