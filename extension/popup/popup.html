<!DOCTYPE html>
<!-- Popup UI for ContextBridge extension — entry point shown on extension icon click. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ContextBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <div class="logo-icon">CB</div>
        <span class="logo">ContextBridge</span>
      </div>
      <a href="../settings/settings.html" target="_blank" class="settings-link" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </a>
    </header>

    <!-- Main content -->
    <div class="main-content">
      <!-- Active tab badge -->
      <div class="tab-badge" id="tab-badge">
        <span class="badge-dot" id="badge-dot"></span>
        <span id="badge-text">Detecting...</span>
      </div>

      <!-- Primary action button -->
      <button class="capture-btn" id="capture-btn" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Capture Context
      </button>

      <!-- Status area -->
      <div class="status-area" id="status-area"></div>
    </div>

    <!-- Session list -->
    <section class="sessions-section">
      <h3 class="sessions-heading">
        Saved Sessions
        <span class="sessions-count" id="sessions-count" style="display:none">0</span>
      </h3>
      <div class="sessions-list" id="sessions-list">
        <p class="empty-state">
          <span class="empty-state-icon">&#128203;</span>
          No sessions yet. Capture a conversation to get started.
        </p>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <span class="conn-dot" id="conn-dot"></span>
      <span id="conn-status">Checking connection...</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
