# Docker Compose for ContextBridge — runs Postgres and the Node.js backend.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: contextbridge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - ./backend/.env
    environment:
      # Inside the Compose network the backend reaches Postgres by service
      # name, not localhost — overrides whatever DATABASE_URL is in .env
      # (which is meant for running `npm start` directly on the host).
      DATABASE_URL: postgresql://postgres:password@postgres:5432/contextbridge
      # Ollama runs natively on the host (not containerized here), so the
      # backend container must reach it via host.docker.internal, not
      # localhost. extra_hosts below makes this resolve on Linux too —
      # Docker Desktop (Mac/Windows) supports it out of the box.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
    volumes:
      - ./backend/data:/app/data

volumes:
  pgdata:
